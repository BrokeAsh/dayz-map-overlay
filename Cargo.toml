[package]
name = "dayz-map"
version = "0.1.0"
edition = "2024"
description = "See-through DayZ map overlay that follows the server you're on"
repository = "https://github.com/BrokeAsh/dayz-map-overlay"
readme = "README.md"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
egui = "0.36"
egui-wgpu = "0.36"
env_logger = "0.11.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4.34"
lzokay-native = "0.1.0"
pollster = "1.0.1"
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay-client-toolkit = "0.21"
texpresso = "2"
toml = "1.1.6"
wayland-client = { version = "0.31", features = ["system"] }
x11rb = { version = "0.14", features = ["xinput"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
